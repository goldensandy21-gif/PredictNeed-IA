# fly.toml app configuration file generated for predictneed-ia on 2026-07-13T01:33:58+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'predictneed-ia'
primary_region = 'fra'
console_command = '/code/manage.py shell'

[build]
[deploy]
  release_command = 'python manage.py migrate --noinput'

[env]
  DJANGO_ALLOWED_HOSTS = 'predictneed-ia.com,www.predictneed-ia.com,predictneed-ia.fly.dev'
  DJANGO_CSRF_TRUSTED_ORIGINS = 'https://predictneed-ia.com,https://www.predictneed-ia.com,https://predictneed-ia.fly.dev'
  DJANGO_DEBUG = 'False'
  PORT = '8000'
  PREDICTNEED_SITE_URL = 'https://predictneed-ia.com'

PREDICTNEED_SUBSCRIPTION_TRIAL_DAYS = '60'
DJANGO_EMAIL_BACKEND = 'django.core.mail.backends.smtp.EmailBackend'
EMAIL_HOST = 'ssl0.ovh.net'
EMAIL_PORT = '465'
EMAIL_HOST_USER = 'webprojectsby.ariane@newfelstudio.fr'
EMAIL_USE_SSL = 'True'
EMAIL_USE_TLS = 'False'
DEFAULT_FROM_EMAIL = 'PredictNeed IA <webprojectsby.ariane@newfelstudio.fr>'
PREDICTNEED_CONTACT_EMAIL = 'webprojectsby.ariane@newfelstudio.fr'
PREDICTNEED_PRIVACY_VERSION = '2026-08-06'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz/"
  [http_service.checks.headers]
    X-Forwarded-Proto = "https"
    Host = "predictneed-ia.com"

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[[statics]]
  guest_path = '/code/staticfiles'
  url_prefix = '/static/'
