<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta
    name="description"
    content="{{ page_description|default:'PredictNeed IA aide les professionnels à comprendre les visiteurs de leur site, qualifier les intentions et transformer les visites en opportunités commerciales.' }}"
>
<meta name="robots" content="{{ robots_meta|default:'index,follow' }}">
{% if request %}
    <link rel="canonical" href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
    <meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
{% endif %}
<meta property="og:type" content="website">
<meta property="og:site_name" content="PredictNeed IA">
<meta property="og:title" content="{{ page_title|default:'PredictNeed IA - Prédiction des besoins visiteurs' }}">
<meta
    property="og:description"
    content="{{ page_description|default:'PredictNeed IA aide les professionnels à comprendre les visiteurs de leur site, qualifier les intentions et transformer les visites en opportunités commerciales.' }}"
>
